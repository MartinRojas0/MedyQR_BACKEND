services:
  - type: web
    name: mediqr-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MEDIQR_CORS_ALLOWED_ORIGINS
        sync: false
      - key: MEDIQR_PUBLIC_APP_URL
        sync: false
      - key: MEDIQR_DOCUMENT_STORAGE_DIR
        sync: false
