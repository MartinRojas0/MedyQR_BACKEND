spring.datasource.url=jdbc:h2:file:./data/mediqr-demo;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false

MEDIQR_DOCUMENT_STORAGE_DIR=./data/documents
app.jwt.secret=${MEDIQR_DEMO_JWT_SECRET}
app.jwt.expiration=86400000
app.cors.allowed-origins=http://127.0.0.1:8810,http://localhost:8810
app.frontend.url=http://127.0.0.1:8810
server.port=8080
